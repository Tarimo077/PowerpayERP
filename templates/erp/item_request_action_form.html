{% extends 'base.html' %}{% block page_title %}{{ title }}{% endblock %}{% block content %}<div class="max-w-xl"><div class="card bg-base-100 border border-base-300"><form method="post"
      class="card-body"
      data-popup-page
      data-popup-title="{{ title }}">{% csrf_token %}<h2 class="card-title">{{ title }}</h2><div class="rounded-xl bg-gradient-to-r from-emerald-50 to-orange-50 border border-base-300 p-4"><b>{{ item_request.number }}</b><p class="text-sm opacity-60">{{ item_request.lines.count }} item(s) · KSh {{ item_request.total_estimated_cost|floatformat:2 }}</p></div>{{ form.as_p }}<div class="card-actions justify-end gap-3"><a href="javascript:history.back()" class="btn btn-ghost">Cancel</a><button class="btn {% if action == 'reject' %}btn-error{% elif action == 'escalate' %}bg-orange-500 border-orange-500 hover:bg-orange-600{% else %}btn-primary{% endif %} text-white">{{ title }}</button></div></form></div></div>{% endblock %}
