{% extends 'base.html' %}{% block page_title %}{{ title }}{% endblock %}{% block content %}<div class="max-w-xl"><div class="card bg-base-100 border border-base-300"><form method="post"
      enctype="multipart/form-data"
      class="card-body"
      data-popup-page
      data-popup-title="{{ title }}">{% csrf_token %}<h2 class="card-title">{{ title }}</h2><div class="rounded-xl border border-orange-200 bg-orange-50 p-4 text-sm"><b>{{ timesheet.employee }}</b><p class="opacity-60">{{ timesheet.period_start|date:'F Y' }}</p></div>{{ form.as_p }}<div class="card-actions justify-end mt-5"><a href="javascript:history.back()" class="btn btn-ghost">Cancel</a><button class="btn btn-primary text-white">Attach signature</button></div></form></div></div>{% endblock %}
