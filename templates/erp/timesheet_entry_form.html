{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="max-w-xl"><div class="card bg-base-100 border border-base-300"><form method="post"
      enctype="multipart/form-data"
      class="card-body"
      data-popup-page
      data-popup-title="{{ title }}">{% csrf_token %}<h2 class="card-title">{{ title }}</h2><p class="text-sm opacity-55">{{ timesheet.period_start }} — {{ timesheet.period_end }}</p>{% for field in form %}<label class="form-control"><span class="label"><span class="label-text">{{ field.label }}</span></span>{{ field }}{% if field.help_text %}<span class="text-xs opacity-60 mt-1">{{ field.help_text }}</span>{% endif %}{{ field.errors }}</label>{% endfor %}<div class="card-actions justify-end mt-5"><a href="javascript:history.back()" class="btn btn-ghost">Cancel</a><button class="btn btn-primary text-white">{{ submit }}</button></div></form></div></div>{% endblock %}
