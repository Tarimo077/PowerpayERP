{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="max-w-xl"><div class="card bg-base-100 border border-base-300"><form method="post" class="card-body" data-popup-page data-popup-title="{{ title }}">{% csrf_token %}<h2 class="card-title">{{ title }}</h2><div class="rounded-2xl border border-base-200 bg-gradient-to-r from-emerald-50 to-orange-50 p-4"><div class="flex items-center justify-between gap-3"><b>{{ task.title }}</b><span class="badge badge-primary text-white">{{ task.get_status_display }}</span></div><p class="text-xs opacity-55 mt-2">Assigned to {{ task.assigned_to }} · Due {{ task.due_date }}</p></div>{% for field in form %}<label class="form-control"><span class="label"><span class="label-text">{{ field.label }}</span></span>{{ field }}{% if field.help_text %}<span class="text-xs opacity-60 mt-1">{{ field.help_text }}</span>{% endif %}{{ field.errors }}</label>{% endfor %}<div class="card-actions justify-end mt-5"><a href="javascript:history.back()" class="btn btn-ghost">Cancel</a><button class="btn btn-primary text-white">Update status</button></div></form></div></div>{% endblock %}
