{% extends 'base.html' %}
{% load static %}
{% block public_content %}
  <div class="min-h-screen bg-base-200 grid place-items-center p-6">
    <div class="card bg-white shadow-xl w-full max-w-md">
      <form method="post" class="card-body">
        {% csrf_token %}<img src="{% static 'images/powerpaylogo.png' %}" class="w-full flex justify-center" /><h1 class="text-2xl font-bold">Reset password</h1><p class="opacity-60">Enter your account email to receive a secure reset link.</p>{{ form.as_p }}<button class="btn btn-primary">Send reset link</button>
      </form>
    </div>
  </div>
{% endblock %}
