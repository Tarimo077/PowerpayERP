name: powerpayerp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
      REDIS_URL: redis://redis:6379/1
    secrets:
      - postgres_password
      - django_secret_key
      - smtp_password
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - egress

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend

  email-retry:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
      REDIS_URL: redis://redis:6379/1
    secrets:
      - postgres_password
      - django_secret_key
      - smtp_password
    command:
      - sh
      - -c
      - while true; do python manage.py retry_failed_email --limit 100; sleep 300; done
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - egress

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  certbot_www:
  letsencrypt:

networks:
  frontend:
  backend:
    internal: true
  egress:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
